name: Rust manual build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install native musl compiler
        if: runner.os == 'Linux'
        run: |
          & sudo apt-get update 2>&1 | Tee-Object -FilePath 'build.log'
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) { Get-Content build.log; exit $buildExitCode }
          & sudo apt-get install --yes musl-tools 2>&1 | Tee-Object -FilePath 'build.log'
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) { Get-Content build.log; exit $buildExitCode }
          $target = '${{ matrix.target }}'.Replace('-', '_')
          "CC_${target}=musl-gcc" | Out-File -FilePath $env:GITHUB_ENV -Append
          $targetKey = $target.ToUpperInvariant()
          "CARGO_TARGET_${targetKey}_LINKER=musl-gcc" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_TARGET_${targetKey}_RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install pinned Rust toolchain
        run: |
          & rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target '${{ matrix.target }}' 2>&1 | Tee-Object -FilePath 'build.log'
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) { Get-Content build.log; exit $buildExitCode }
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ matrix.target }}-1.95.0-${{ hashFiles('Cargo.lock') }}
      - name: Verify, build and package
        run: ./scripts/ci.ps1 -Target '${{ matrix.target }}' -Platform '${{ matrix.platform }}'
      - name: Upload packages and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: aihmc-auth-${{ matrix.platform }}
          path: |
            test-output/artifacts/*
            test-output/logs/*
            build.log
