[package]
name = "aihmc-auth"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
axum = "0.8.9"
bcrypt = "0.19.3"
md5 = "0.8"
regex = "1"
psl = "2.1.254"
rand = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
