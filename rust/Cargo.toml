[package]
name = "aihmc-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
axum = "0.8.9"
rsa = { version = "0.9", features = ["sha1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
toml = "1.2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
